function render(LAYERS){
var map = L.map('map');
var imagery = L.tileLayer(
  'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  {maxZoom:19, attribution:'Imagery &copy; Esri'}).addTo(map);
var streets = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'&copy; OpenStreetMap'});

var CURRENCY_FIELDS = ['PricePerAcre', 'TotalPrice'];
function popup(props){
  var rows = Object.keys(props).filter(function(k){
    var v = props[k];
    return v !== null && v !== undefined && v !== '';
  }).map(function(k){
    var v = props[k];
    if (typeof v === 'number' && k === 'Acres') v = v.toLocaleString(undefined,{maximumFractionDigits:0}) + ' ac';
    else if (typeof v === 'number' && CURRENCY_FIELDS.indexOf(k) !== -1) v = '$' + v.toLocaleString(undefined,{maximumFractionDigits:0});
    else if (k === 'Link') v = '<a href="'+v+'" target="_blank" rel="noopener">View listing</a>';
    return '<div><b>'+k+'</b> '+v+'</div>';
  });
  return rows.length ? rows.join('') : null;
}

var css = LAYERS.filter(function(c){return c.label}).map(function(c){
  var h = c.label.halo, ring = h ? ['-1px -1px 0 '+h,'1px -1px 0 '+h,'-1px 1px 0 '+h,'1px 1px 0 '+h].join(',') : 'none';
  return '.lbl-'+c.name.replace(/[^A-Za-z0-9]/g,'') + '{color:'+c.label.color+';font-size:'+c.label.size+'pt;text-shadow:'+ring+';text-align:center;line-height:1.25}';
}).join(' ');
document.head.appendChild(document.createElement('style')).textContent = css;

var overlays = {}, bounds = L.latLngBounds([]);
LAYERS.forEach(function(cfg){
  var lyr = L.geoJSON(cfg.data, {
    style: function(f){
      var c = cfg.colorField ? ((f.properties||{})[cfg.colorField] || cfg.stroke) : cfg.stroke;
      return {color: c, weight: 2, fillColor: cfg.colorField ? c : cfg.fill, fillOpacity: cfg.fillOpacity};
    },
    pointToLayer: function(f, latlng){
      return L.circleMarker(latlng, {radius:5, color:cfg.stroke, weight:1, fillColor:cfg.fill, fillOpacity:1});
    },
    onEachFeature: function(f, l){
      var p = popup(f.properties||{});
      if (p) l.bindPopup('<div style="font-weight:600;margin-bottom:4px">'+cfg.name+'</div>'+p);
      if (cfg.label){
        var txt = (f.properties||{})[cfg.label.field];
        if (txt) l.bindTooltip(String(txt).split(String.fromCharCode(10)).join('<br>'), {permanent:true, direction:'center',
          className:'lbl lbl-'+cfg.name.replace(/[^A-Za-z0-9]/g,''), opacity:1}).openTooltip();
      }
    }
  }).addTo(map);
  overlays[cfg.name] = lyr;
  if (cfg.data.features.length) bounds.extend(lyr.getBounds());
});

L.control.layers({'Satellite':imagery,'Streets':streets}, overlays, {collapsed:false}).addTo(map);

var raw = function(s){return Uint8Array.from(atob(s), function(c){return c.charCodeAt(0)})};
document.getElementById('gate').style.display = 'flex';
document.getElementById('go').onclick = async function(){
  var msg = document.getElementById('msg'), pw = document.getElementById('pw').value;
  msg.textContent = 'Decrypting...';
  try {
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      {name:'PBKDF2', salt:raw(ENC.salt), iterations:ENC.iter, hash:'SHA-256'},
      base, {name:'AES-GCM', length:256}, false, ['decrypt']);
    var out = await crypto.subtle.decrypt({name:'AES-GCM', iv:raw(ENC.iv)}, key, raw(ENC.ct));
    document.getElementById('gate').remove();
    render(JSON.parse(new TextDecoder().decode(out)));
  } catch(e) { msg.textContent = 'Wrong passphrase.'; }
};
document.getElementById('pw').addEventListener('keydown', function(e){
  if (e.key === 'Enter') document.getElementById('go').click();
});
